name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      # A prerelease claims the name under `next`; only a full release moves `latest`.
      - run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
