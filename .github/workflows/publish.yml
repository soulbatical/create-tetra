name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      # A prerelease claims the name under `next`; only a full release moves `latest`.
      #
      # This package publishes through npm trusted publishing (OIDC), using the
      # id-token permission above. There is deliberately no auth token in the
      # env below: setup-node writes an .npmrc whose _authToken expands from
      # that variable, and defining it makes npm attempt token auth instead of
      # OIDC. Adding it back turns a working publish into a 401.
      - run: npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
